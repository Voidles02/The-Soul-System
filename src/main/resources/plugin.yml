name: Souls
version: '${version}'
prefix: Enhanced
main: com.KDI.souls.SoulsPlugin
api-version: '1.21.11'
author: voidles02
softdepend:
  - PlaceholderAPI
  - LuckPerms
commands:
  souls:
    description: View and manage Souls.
    usage: /souls
    aliases:
      - soul
  guide:
    description: Open the Souls tutorial book.
    usage: /guide
    aliases:
      - soul-guide
  souls-performance:
    description: View Souls and server performance metrics.
    usage: /souls-performance
permissions:
  souls.use:
    description: Use the Souls command.
    default: true
  souls.performance:
    description: View the Souls performance report.
    default: true
  souls.pay:
    description: Pay Souls to another player.
    default: true
  souls.admin:
    description: Use administrative Souls commands.
    default: op
  souls.altar:
    description: Use Soul Altars.
    default: true
  souls.shrine:
    description: Use Soul Shrines.
    default: true
