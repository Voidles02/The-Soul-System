database:
  type: sqlite
  file: souls.db
  host: localhost
  port: 3306
  name: souls
  username: root
  password: change-me
  parameters: '?useUnicode=true&characterEncoding=utf8'

resource-pack:
  # The plugin hosts its bundled pack. Set host to the public hostname/IP players can reach.
  # Allow inbound TCP traffic on this port; bind-address controls the local interface.
  host: ''
  bind-address: '0.0.0.0'
  port: 8765

souls:
  max-balance: 1000

superweapon:
  cooldowns:
    dash-millis: 120000
    slam-millis: 300000
    activate-millis: 900000
    beam-millis: 600000
  info-book:
    title: 'Soul Weapons'
    author: Souls
    pages:
      - "&5&lSOUL WEAPON FIELD GUIDE\n\n&7Learn the weapons, cooldowns, and optional Soul features. Cooldown values and feature states reflect this server's settings when opened."
      - "&d&lBOOK OF BŌC\n\n&7Right-click: self-buffs.\nLeft-click: 5-second, 45-block beam followed by 3 shockwaves.\n\n&7Activation: &f{activate-cooldown}\nBeam: &f{beam-cooldown}"
      - "&5&lTHE SARCULUM\n\n&7Sneak + left-click: steerable dash up to 25 blocks.\nSneak + right-click: slam. Airborne with a mace in your hotbar triggers an enhanced two-impact slam.\n\nDash: &f{dash-cooldown}\nSlam: &f{slam-cooldown}"
      - "&b&lSOUL SYSTEMS\n\n&7Soul progression, mob rewards, player trading, fragments, Altars, and Shrines are configurable. Use &f/souls &7to view your balance."
      - "&6&lOPTIONAL FEATURES\n\n&7Shop: {shop-status}\nAltar: {altar-status}\nPowers: {powers-status}\nBounties: {bounties-status}\nShrines: {shrines-status}\nRandom events: {events-status}\n\n&8Customize these pages in config.yml."
  artifacts:
    track-owners: true
    boc:
      enabled: true
    sarculum:
      enabled: true

local-data:
  enabled: true
  folder: server-data

guide:
  auto-open: true

earning:
  pve:
    enabled: true
    rewards:
      ZOMBIE: 1
      SKELETON: 1
      SPIDER: 1
      CREEPER: 2
      ENDERMAN: 4
      BLAZE: 3
      WITHER_SKELETON: 5
  pvp:
    enabled: true
    base-reward: 10
    cooldown-seconds: 3600
    diminishing-period-seconds: 86400
    diminishing-factor: 0.5

fragments:
  enabled: true
  conversion-rate: 10
  # The custom Soul Fragment texture requires PRISMARINE_SHARD as the base material.
  item-material: PRISMARINE_SHARD
  item-name: '&bSoul Fragment'
  pve-drops:
    ZOMBIE: 1
    SKELETON: 1
    BOGGED: 1
    CAVE_SPIDER: 1
    DROWNED: 1
    ENDERMITE: 1
    HUSK: 1
    SILVERFISH: 1
    SPIDER: 1
    STRAY: 1
    ZOMBIE_VILLAGER: 1
    ZOMBIFIED_PIGLIN: 1
    BLAZE: 2
    BREEZE: 2
    CREEPER: 2
    GUARDIAN: 2
    HOGLIN: 2
    MAGMA_CUBE: 2
    PHANTOM: 2
    PIGLIN: 2
    PILLAGER: 2
    SHULKER: 2
    SLIME: 2
    VEX: 2
    WITCH: 2
    WITHER_SKELETON: 2
    ZOGLIN: 2
    ENDERMAN: 3
    EVOKER: 3
    GHAST: 3
    PIGLIN_BRUTE: 3
    VINDICATOR: 3
    RAVAGER: 5
    ELDER_GUARDIAN: 8
    WARDEN: 16
    WITHER: 24
    ENDER_DRAGON: 32

boost:
  enabled: true
  souls-per-step: 100
  amplifier-per-step: 0.5
  max-nerf: 0.80
  haste: true
  strength: true
  speed: true
  absorption: true

loss:
  enabled: true
  percentage: 0.50
  maximum: 0

worlds:
  default:
    enabled: true
    pve: true
    pvp: true

features:
  shop:
    enabled: true
  altar:
    enabled: true
  powers:
    enabled: true
  bounties:
    enabled: true
  shrines:
    enabled: true
  random-events:
    enabled: true

altar:
  cost: 50
  permission: souls.altar
  upgrades:
    damage:
      min: 0.02
      max: 0.30
    durability:
      min: 0.02
      max: 0.35
    lifesteal:
      min: 0.02
      max: 0.20
    attract:
      min: 0.02
      max: 0.20
    crit:
      min: 0.0225
      max: 0.045
  caps:
    damage: 1.50
    durability: 3.00
    lifesteal: 0.70
    attract: 0.70
    crit: 0.45
  feedback:
    sound: BLOCK_ENCHANTMENT_TABLE_USE
    particle: ENCHANT

shrine:
  cooldown-hours: 2
  permission: souls.shrine
  reward:
    type: random
    souls: 25
    fragments: 2
    event-chance: 1.0
    broadcast: true
    buff:
      type: SPEED
      duration-seconds: 300
      amplifier: 1
  feedback:
    sound: BLOCK_BEACON_ACTIVATE
    particle: SOUL_FIRE_FLAME
