  cost: 50
  permission: souls.altar
  upgrades:
    damage:
      min: 0.02
      max: 0.30
    durability:
      min: 0.02
      max: 0.35
    lifesteal:
      min: 0.02
      max: 0.20
    attract:
      min: 0.02
      max: 0.20
    crit:
      min: 0.0225
      max: 0.045
