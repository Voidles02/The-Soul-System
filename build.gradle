plugins {
    id 'java'
}

group = 'com.KDI'
version = '2.0.4'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'com.github.cryptomorin:XSeries:11.2.0.1'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    dependsOn tasks.named('resourcePackZip')
    from(tasks.named('resourcePackZip').flatMap { it.archiveFile }) {
        into('')
    }
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.register('resourcePackZip', Zip) {
    archiveFileName = 'souls-resource-pack.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('resource-pack')
}

tasks.register('resourcePackSha1') {
    dependsOn tasks.named('resourcePackZip')
    def archive = tasks.named('resourcePackZip').flatMap { it.archiveFile }
    doLast {
        File pack = archive.get().asFile
        byte[] digest = java.security.MessageDigest.getInstance('SHA-1').digest(pack.bytes)
        String sha1 = digest.collect { String.format('%02x', it & 0xff) }.join()
        new File(pack.parentFile, pack.name + '.sha1').text = sha1 + System.lineSeparator()
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('resourcePackSha1')
}
